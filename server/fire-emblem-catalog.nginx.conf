# Public read-only catalogue responses; all writes are unsupported.
location ~ ^/(catalog\.js|roster\.json|learning\.json|map\.json)$ {
    proxy_pass http://127.0.0.1:18776;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
location ^~ /api/ {
    proxy_pass http://127.0.0.1:18776;
    proxy_set_header Host $host;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
}
