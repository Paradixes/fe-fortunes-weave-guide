name: Deploy production

# Slow runner-to-server transfers need a full upload budget and receiver progress.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish the current deployment before starting another one.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate source and catalogue
        run: |
          node scripts/build-catalog.cjs
          git diff --exit-code -- data/catalog.json dist/catalog.js dist/roster.json dist/learning.json dist/map.json
          node scripts/verify-site.cjs
          node scripts/verify-workbench.cjs
          node scripts/verify-cultivation.cjs
          python3 scripts/verify-sqlite.py
          python3 scripts/verify-deploy.py
          python3 scripts/check-public-export.py
      - name: Package runtime
        env:
          DEPLOY_SHA: ${{ github.sha }}
          DEPLOY_RUN: ${{ github.run_id }}
          DEPLOY_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          manifest = {
              'sha': os.environ['DEPLOY_SHA'],
              'release': '-'.join(os.environ[k] for k in ('DEPLOY_SHA', 'DEPLOY_RUN', 'DEPLOY_ATTEMPT')),
          }
          Path('dist/deployment.json').write_text(json.dumps(manifest) + '\n')
          PY
          tar --exclude='__pycache__' -czf "$RUNNER_TEMP/release-full.tar.gz" dist data/catalog.sqlite3 server/catalog_server.py
          # Prefer a delta when the HTTPS manifest is reachable; log a full fallback.
          LIVE_SHA=''
          if curl -fsS --max-time 10 "https://fe-fortunes-weave.intramode.site/deployment.json" -o "$RUNNER_TEMP/live-deployment.json"; then
            LIVE_SHA=$(python3 - "$RUNNER_TEMP/live-deployment.json" <<'PY'
          import json, re, sys
          from pathlib import Path
          try:
              value = json.loads(Path(sys.argv[1]).read_text()).get('sha', '')
              print(value if isinstance(value, str) and re.fullmatch(r'[0-9a-f]{40}', value) else '')
          except (OSError, ValueError, AttributeError):
              print('')
          PY
            )
          fi
          DELTA_OK=0
          if [ -n "${LIVE_SHA:-}" ] && git cat-file -e "$LIVE_SHA^{commit}" 2>/dev/null; then
            git diff --name-status --no-renames "$LIVE_SHA" "$DEPLOY_SHA" -- dist data/catalog.sqlite3 server/catalog_server.py > "$RUNNER_TEMP/delta-status.txt"
            python3 - "$LIVE_SHA" <<'PY'
          import json, os, sys
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          changed, deleted = [], []
          for line in (temp / 'delta-status.txt').read_text().splitlines():
              status, _, name = line.partition('\t')
              if status == 'D':
                  deleted.append(name)
              elif name:
                  changed.append(name)
          if 'dist/deployment.json' not in changed:
              changed.append('dist/deployment.json')
          (temp / 'delta.json').write_text(json.dumps({'base': sys.argv[1], 'deleted': deleted}) + '\n')
          (temp / 'delta-files.txt').write_text('\n'.join(changed) + '\n')
          PY
            DELTA_DIR="$RUNNER_TEMP/delta-tree"
            mkdir -p "$DELTA_DIR"
            while IFS= read -r f; do
              mkdir -p "$DELTA_DIR/$(dirname "$f")"
              cp "$f" "$DELTA_DIR/$f"
            done < "$RUNNER_TEMP/delta-files.txt"
            cp "$RUNNER_TEMP/delta.json" "$DELTA_DIR/delta.json"
            tar -czf "$RUNNER_TEMP/release-delta.tar.gz" -C "$DELTA_DIR" .
            FULL_SIZE=$(stat -c %s "$RUNNER_TEMP/release-full.tar.gz")
            DELTA_SIZE=$(stat -c %s "$RUNNER_TEMP/release-delta.tar.gz")
            echo "Full ${FULL_SIZE} bytes vs delta ${DELTA_SIZE} bytes (base ${LIVE_SHA:0:7})"
            if [ "$DELTA_SIZE" -lt "$FULL_SIZE" ]; then DELTA_OK=1; fi
          fi
          if [ "$DELTA_OK" = 1 ]; then
            cp "$RUNNER_TEMP/release-delta.tar.gz" "$RUNNER_TEMP/release.tar.gz"
            echo "Selected incremental archive."
          else
            echo "::warning::Incremental deployment unavailable; uploading the full archive with a 60-minute SSH budget."
            cp "$RUNNER_TEMP/release-full.tar.gz" "$RUNNER_TEMP/release.tar.gz"
          fi
          echo "Archive size: $(stat -c %s "$RUNNER_TEMP/release.tar.gz") bytes. Server logs report actual received bytes every 15 seconds."
      - name: Deploy over verified SSH
        timeout-minutes: 65
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER}"
          : "${DEPLOY_SSH_KEY:?Missing DEPLOY_SSH_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing DEPLOY_KNOWN_HOSTS}"
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          chmod 700 "$keydir"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$keydir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$keydir/known_hosts"
          chmod 600 "$keydir/key" "$keydir/known_hosts"
          start=$SECONDS
          deadline=$((start + 3600))
          deploy() {
            remaining=$((deadline - SECONDS))
            if (( remaining <= 0 )); then return 124; fi
            timeout --kill-after=10s "$remaining" ssh -T -F /dev/null -i "$keydir/key" \
              -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$keydir/known_hosts" -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" < "$1"
          }
          if deploy "$RUNNER_TEMP/release.tar.gz"; then
            :
          else
            status=$?
            if (( status == 124 || status == 137 )); then
              echo "::error::SSH deployment exceeded its 60-minute budget. Review the last receiver progress line; this is not a successful release."
              exit "$status"
            elif (( SECONDS - start < 120 )); then
              echo "Deploy failed fast (auth/connectivity or delta rejected); retrying once with the full archive" >&2
              if deploy "$RUNNER_TEMP/release-full.tar.gz"; then
                :
              else
                status=$?
                echo "::error::Full-archive retry failed (exit $status); both attempts share the same 60-minute budget."
                exit "$status"
              fi
            else
              echo "::error::SSH deployment failed after $((SECONDS - start)) seconds (exit $status). Review receiver progress and SSH errors."
              exit "$status"
            fi
          fi
      - name: Write deployment summary
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: printf 'Deployed `%s`. SQLite and HTTPS checks passed.\n' "$DEPLOY_SHA" >> "$GITHUB_STEP_SUMMARY"
